[tool.poetry]
name = "claude-pulse"
version = "0.1.0"
description = "Monitor Claude usage from CLI - 从命令行监控 Claude 使用量"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "claude_pulse", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
rich = "^13.7.0"
pydantic = "^2.5.0"
playwright = "^1.40.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
claude-pulse = "claude_pulse.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
